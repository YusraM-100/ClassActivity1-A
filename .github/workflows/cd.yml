name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/yusram-100/classactivity1-a:${{ steps.version.outputs.version }}
            ghcr.io/yusram-100/classactivity1-a:latest

  deploy-staging:
    name: Deploy staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start staging container on runner
        run: |
          docker pull ghcr.io/yusram-100/classactivity1-a:${{ needs.build.outputs.version }}
          docker run -d --name mlops-staging -p 5000:5000 \
            ghcr.io/yusram-100/classactivity1-a:${{ needs.build.outputs.version }}

  smoke-test:
    name: Staging smoke test
    needs:
      - build
      - deploy-staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start staging container for smoke test
        run: |
          docker pull ghcr.io/yusram-100/classactivity1-a:${{ needs.build.outputs.version }}
          docker run -d --name mlops-staging-test -p 5000:5000 \
            ghcr.io/yusram-100/classactivity1-a:${{ needs.build.outputs.version }}

      - name: Check staging health endpoint
        run: curl --fail --retry 10 --retry-delay 5 http://localhost:5000/health

  deploy-production:
    name: Deploy production
    needs:
      - build
      - smoke-test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start production container on runner
        run: |
          docker pull ghcr.io/yusram-100/classactivity1-a:${{ needs.build.outputs.version }}
          docker run -d --name mlops-production -p 5000:5000 \
            ghcr.io/yusram-100/classactivity1-a:${{ needs.build.outputs.version }}
